[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-animator"
version = "0.1.0"
description = "Turn a whiteboard-style image into a hand-drawn reveal video."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Masih Sultani" }]
keywords = ["whiteboard", "animation", "explainer", "video", "ffmpeg", "craft"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "Pillow>=10",
    "onnxruntime>=1.16",
    "pydantic>=2",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
whiteboard-animate = "whiteboard_animator.cli:main"

[project.urls]
Homepage = "https://github.com/masihsultani/whiteboard-animator"

[tool.setuptools.packages.find]
include = ["whiteboard_animator*"]

[tool.setuptools.package-data]
whiteboard_animator = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
